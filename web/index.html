<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover：让页面延伸到 iPhone 刘海/圆角区域，
      再由 CSS 的 env(safe-area-inset-*) 决定内容避让，避免顶栏被刘海压住。
      maximum-scale 不限制：用户放大查看内容应当允许（无障碍要求）。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- 移动端浏览器地址栏跟随主题色，观感更整体 -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <title>摸鱼大师智能助手</title>
    <script>
      // 首帧前定好主题，避免刷新时闪白/闪黑。
      // 与 src/lib/theme.tsx 使用同一个 storage key，改一处要改两处。
      (function () {
        try {
          var stored = localStorage.getItem("reelax-theme");
          var theme =
            stored === "dark" || stored === "light"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.classList.toggle("dark", theme === "dark");
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          /* localStorage 不可用时按亮色渲染 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
