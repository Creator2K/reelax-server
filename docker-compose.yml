# Reelax 服务器版 · Docker Compose
#
# 用法：
#   1) 生成主密钥：openssl rand -hex 32
#   2) 写进 .env：MASTER_KEY=<上面那串>（Windows 见 README）
#   3) docker compose up -d --build
#   4) 打开 http://<服务器>:8580 —— 第一个注册的账号自动成为管理员
#
# 在线更新（可选）：
#   把下面的 updater 服务一起启动，就能在「管理 → 系统」里点「检查更新 / 立即更新」：
#     docker compose --profile update up -d --build
#
# ★ MASTER_KEY 必须长期保存：它就是凭证加密主密钥。弄丢之后数据库里的游戏密码 /
#   Cookie / 推送 SendKey 全部无法解密（表现为「账号突然登不上」）。

# ★ 显式固定 compose 项目名。
#   不写这一行时，项目名会从**目录名**推导：宿主机上跑是 reelax-server，
#   而 updater 容器里仓库挂在 /project → 项目名变成 project。
#   两个项目名不同会导致：
#     · 网络/卷被重新创建（project_default / project_reelax-data，数据卷对不上）
#     · container_name 冲突（Container name "/reelax-server" is already in use）
#   所以必须在这里写死，updater 也用同一个名字。
name: reelax-server

services:
  app:
    build:
      context: .
      args:
        # 把当前提交烧进镜像，「在线更新」才能显示当前版本
        APP_COMMIT: "${APP_COMMIT:-unknown}"
        APP_BUILD_TIME: "${APP_BUILD_TIME:-unknown}"
    # 预构建镜像：GitHub Actions 每次 main 提交都会构建并推到 GHCR（见 .github/workflows/ci.yml）。
    #   · 没有 git 的部署（tar 解压）：docker compose pull app && docker compose up -d
    #   · 本地构建照旧可用（scripts/update.sh、updater、docker compose build），构建产物也打这个 tag
    image: ghcr.io/creator2k/reelax-server:latest
    container_name: reelax-server
    restart: unless-stopped
    # 关停给足时间：停引擎 + 关推送 + 关 HTTP + 落最后一批日志 + WAL checkpoint。
    # Docker 默认只给 10 秒，账号多的时候会被 SIGKILL 掉（丢状态、丢日志）。
    stop_grace_period: 30s

    ports:
      - "${PORT:-8580}:8580"

    environment:
      # ---- 必填 ----
      MASTER_KEY: "${MASTER_KEY:?请先在 .env 里设置 MASTER_KEY（openssl rand -hex 32）}"

      # ---- 监听（容器内固定 0.0.0.0，对外端口由上面 ports 控制）----
      PORT: 8580
      HOST: 0.0.0.0
      DATA_DIR: /app/data

      # ---- 时区 ----
      # ★ 容器默认是 UTC，不设这一项时：「日报 09:00（本地时间）」实际是北京时间 17:00，
      #   统计页也会按 UTC 天分桶（日界在北京时间早上 8 点）。
      #   Node 自带时区库，不需要在镜像里装 tzdata（已实测 getHours 跟着 TZ 走）。
      TZ: "${TZ:-Asia/Shanghai}"

      # ---- 游戏 ----
      REELAX_BASE_URL: "${REELAX_BASE_URL:-https://reelax.cn}"
      # 无代理账号的兜底出口（可选）
      REELAX_GLOBAL_PROXY: "${REELAX_GLOBAL_PROXY:-}"
      # 出口 IP 探测（代理连通性测试用）
      PROXY_ECHO_URL: "${PROXY_ECHO_URL:-https://api.ipify.org?format=json}"

      # ---- 反向代理 / HTTPS ----
      # ★ 默认 0（不信任代理头）：信任 X-Forwarded-For 等于让客户端自己填 IP，
      #   直连暴露时登录/注册/邀请码的限流会全部失效（换一个假 IP 换一个限流桶）。
      #   在 Nginx / Caddy 之后部署时才设为 1，并且**必须让反代覆盖**这个头：
      #     nginx: proxy_set_header X-Forwarded-For $remote_addr;
      #   （若用 $proxy_add_x_forwarded_for 追加，客户端伪造的前缀仍在最左边，仍可绕过）
      TRUST_PROXY: "${TRUST_PROXY:-0}"
      # cookie 的 Secure 策略（三态）：
      #   不设置（默认）= 按每次请求的实际协议自动判断 —— 推荐，http/https 都能正常工作
      #   1 = 强制加 Secure（必须整站 HTTPS；只做 80 端口反代会「登录成功但立刻掉线」）
      #   0 = 强制不加
      COOKIE_SECURE: "${COOKIE_SECURE:-}"

      # ---- 注册与配额 ----
      ALLOW_REGISTRATION: "${ALLOW_REGISTRATION:-1}"
      MAX_ACCOUNTS_PER_USER: "${MAX_ACCOUNTS_PER_USER:-5}"
      MAX_RUNNING_ACCOUNTS: "${MAX_RUNNING_ACCOUNTS:-50}"

      # ---- 部署时的默认管理员 ----
      # 启动时自动确保存在这个管理员账号（纯后台角色，不挂游戏）
      # 口令留空 = 首次创建时随机生成，并在启动日志与 data/INITIAL_ADMIN.txt 里打印一次
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"

      # ---- 在线更新 ----
      # 仓库地址（查询远端最新提交用）
      REELAX_REPO: "${REELAX_REPO:-Creator2K/reelax-server}"
      # 私有仓库需要 GITHUB_TOKEN 才能读到远端提交信息（可选）
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      # 旁路更新器地址；启用了 update profile 才会实际存在
      REELAX_UPDATER_URL: "${REELAX_UPDATER_URL:-}"
      # 更新器令牌（可选）。与下面 updater 的 UPDATER_TOKEN 用同一个 .env 变量，
      # 两边必须一致，否则一键更新会返回 401
      REELAX_UPDATER_TOKEN: "${UPDATER_TOKEN:-}"
      # 容器内不允许自行 git pull（代码在镜像里，改不了自己）—— 更新交给 updater
      ALLOW_LOCAL_UPDATE: "0"

      # ---- 日志 ----
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      LOG_RETENTION_DAYS: "${LOG_RETENTION_DAYS:-14}"

      # ---- 会话 ----
      SESSION_TTL_DAYS: "${SESSION_TTL_DAYS:-30}"

    volumes:
      # 数据库、日志、备份、微信登录凭证都在这里。备份策略见 docs/DEPLOY.md
      - reelax-data:/app/data

    # 容器内资源上限（按机器调整）。挂机本身很轻，主要是并发登录的瞬时开销。
    # ★ 实测 2 个账号约 58MB；scrypt 每次哈希瞬时约 32MB。
    #   按默认 MAX_RUNNING_ACCOUNTS=50 估计峰值 300~500MB，512M 会贴边触发 OOM
    #   （OOM = 整体重启 + 所有账号重连），所以默认给 1G。
    deploy:
      resources:
        limits:
          memory: 1G

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---- 可选：在线更新器 ----
  #
  # 它是唯一能改代码的容器（挂了 docker.sock）。只在需要点「立即更新」时启动：
  #   docker compose --profile update up -d --build
  #
  # 安全说明：docker.sock 等同于宿主机 root 权限，所以这个服务**不对外暴露端口**，
  # 只监听 compose 内网，并且只能被 app 触发。
  updater:
    build: ./updater
    image: reelax-updater:latest
    container_name: reelax-updater
    restart: unless-stopped
    profiles: ["update"]

    environment:
      UPDATER_PORT: 9000
      # 容器内看到的是挂载进来的仓库目录
      UPDATER_PROJECT_DIR: /project
      UPDATER_COMPOSE_FILE: docker-compose.yml
      UPDATER_SERVICE: app
      # auto（默认）：挂载目录有 .git 就走 git（git pull + 本机构建），
      # 否则走 pull（拉 GHCR 预构建镜像，几乎不吃 CPU）—— tar 解压部署用这个。
      UPDATER_MODE: "${UPDATER_MODE:-auto}"
      # 只在 pull 模式下用来读「这次换到了哪个提交」；与上面 app 的 image 保持一致
      UPDATER_IMAGE: "${UPDATER_IMAGE:-ghcr.io/creator2k/reelax-server:latest}"
      UPDATER_REBUILD: "1"
      # ★ 与上面 name: 保持一致：updater 必须操作**同一个** compose 项目，
      #   否则它会新建一套容器/网络/卷，并在 container_name 上撞车。
      COMPOSE_PROJECT_NAME: reelax-server
      # 可选：额外一道令牌（app 侧用 REELAX_UPDATER_TOKEN 提供）
      UPDATER_TOKEN: "${UPDATER_TOKEN:-}"
      # 私有仓库拉取凭据（public 仓库可留空）
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"

    volumes:
      # 宿主机仓库目录（改这里要同步改 .env 的 REELAX_PROJECT_DIR）
      - "${REELAX_PROJECT_DIR:-.}:/project"
      # 让 updater 能操作 docker
      - /var/run/docker.sock:/var/run/docker.sock

    # 不映射端口：只在 compose 网络内可达（app 用 http://updater:9000 访问）
    expose:
      - "9000"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  reelax-data:
