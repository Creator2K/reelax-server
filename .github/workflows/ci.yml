name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# 只读权限：CI 不需要写仓库
permissions:
  contents: read

jobs:
  verify:
    name: 类型检查 / Lint / 测试 / 构建
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 必须是 Node 24：服务端用了内置的 node:sqlite，并依赖原生 TS 类型剥离直接运行 .ts
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # --ignore-scripts：esbuild / 原生模块的 postinstall 在 CI 里不需要
      - name: 安装依赖
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: 类型检查
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # 含越权矩阵、真实 CONNECT 隧道的代理端到端、WS 用户隔离、签名手算对账
      - name: 测试
        run: npm test

      - name: 构建前端
        run: npm run build

      # ★ 之前 CI 完全不碰 Docker：Dockerfile / compose 改坏了只有部署时才会发现。
      #   这里真的构建镜像并让它跑起来探一次健康检查。
      - name: 构建生产镜像
        run: docker build --build-arg APP_COMMIT="${GITHUB_SHA}" -t reelax-ci-check .

      - name: 校验 compose 配置
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i 's|^MASTER_KEY=$|MASTER_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef|' .env
          docker compose -f docker-compose.yml config -q
          rm -f .env

      - name: 镜像冒烟运行（健康检查 + 鉴权）
        run: |
          set -euo pipefail
          docker run -d --name reelax-ci -e MASTER_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef -p 18581:8580 reelax-ci-check
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18581/api/health > /dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "镜像未在 60 秒内通过健康检查："
            docker logs reelax-ci
            docker rm -f reelax-ci
            exit 1
          fi
          echo "--- /api/health ---"
          curl -fsS http://127.0.0.1:18581/api/health
          echo ""
          echo "--- 未登录访问业务接口应为 401 ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18581/api/accounts)
          test "$code" = "401" && echo "鉴权 OK (401)"
          docker rm -f reelax-ci

      # 冒烟：用生产模式起一遍完整服务，确认能启动、能建库、SPA 可访问
      - name: 冒烟启动（生产模式）
        env:
          MASTER_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          DATA_DIR: /tmp/reelax-ci-data
          PORT: "18580"
          HOST: "127.0.0.1"
          NODE_ENV: production
          COOKIE_SECURE: "0"
          LOG_LEVEL: error
        run: |
          set -euo pipefail
          node server/src/index.ts &
          SERVER_PID=$!
          # 等健康检查就绪（最多 30 秒）
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18580/api/health > /dev/null 2>&1; then
              echo "健康检查通过（第 ${i} 次尝试）"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "服务未在 30 秒内就绪"
              kill $SERVER_PID || true
              exit 1
            fi
            sleep 1
          done
          echo "--- /api/health ---"
          curl -fsS http://127.0.0.1:18580/api/health
          echo ""
          echo "--- SPA 首页（应含 #root 与主题引导脚本） ---"
          curl -fsS http://127.0.0.1:18580/ | grep -q 'id="root"' && echo "SPA OK"
          echo "--- 未登录访问业务接口应为 401 ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18580/api/accounts)
          test "$code" = "401" && echo "鉴权 OK (401)"
          kill $SERVER_PID || true
          wait $SERVER_PID 2>/dev/null || true

      - name: 上传失败时的冒烟日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: |
            /tmp/reelax-ci-data
          if-no-files-found: ignore
          retention-days: 3

  # ---------------------------------------------------------------------------
  # 预构建镜像：把 main 上每次通过校验的提交构建成镜像推到 GHCR。
  #
  # 为什么要它：有些部署是**下载 tar 包**解压出来的（宿主机没有 .git），
  # 那种情况下 scripts/update.sh 与 updater 都用不了，只能在本地重建。
  # 有了预构建镜像之后，更新就是：
  #     docker compose pull app && docker compose up -d
  # 而且镜像里烧进了提交号（APP_COMMIT）→ 面板的「当前版本」永远读得到。
  #
  # 只在 main 的 push 上跑（PR 不推）；needs: verify → 校验不过的提交绝不发布。
  # ---------------------------------------------------------------------------
  publish:
    name: 构建并推送镜像（GHCR）
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # 推 GHCR 用仓库自带的 GITHUB_TOKEN 就够，不需要额外的 PAT
      packages: write
    # 两次推送撞车时，取消旧的那次：否则慢的那次后完成，会把 latest 覆盖成旧代码
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      # GHCR 的镜像名必须全小写（Creator2K → creator2k）
      - name: 计算镜像名与短提交号
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      # arm64 那一腿是模拟执行的，必须先注册 QEMU
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          # 双架构：不知道部署机是 x86 还是 ARM 时都能跑（QEMU 稍慢，但有缓存）
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ steps.image.outputs.short }}
          build-args: |
            APP_COMMIT=${{ github.sha }}
            APP_BUILD_TIME=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
